# Data Quality Rules Configuration Demo Backup
# Project: DataGuard Framework
# Description: Demo quality rules for my_store_db

users:
  required_columns:
  - id
  - name
  - email
  - role
  - created_at
  unique_columns:
  - id
  - email
  not_null_columns:
  - id
  - name
  - email
  format_checks:
    email: email
    name: alpha_with_spaces
  range_checks:
    name:
      min_length: 2
      max_length: 100

orders:
  required_columns:
  - id
  - user_id
  - amount
  - status
  - order_date
  unique_columns:
  - id
  not_null_columns:
  - id
  - user_id
  - amount
  - status
  - order_date
  range_checks:
    amount:
      min: 0
      max: 1000000
  categorical_checks:
    status:
      allowed_values:
      - pending
      - processing
      - shipped
      - delivered
      - cancelled
  referential_integrity:
    user_id:
      foreign_table: users
      foreign_column: id

products:
  required_columns:
  - id
  - title
  - category
  - price
  - in_stock
  unique_columns:
  - id
  not_null_columns:
  - id
  - title
  - price
  - in_stock
  range_checks:
    price:
      min: 0
      max: 100000
    in_stock:
      min: 0
      max: 10000
    title:
      min_length: 2
      max_length: 200
  categorical_checks:
    category:
      allowed_values:
      - Electronics
      - Accessories
      - Audio
      - Office
      - Furniture
      - Lighting

global_rules:
  row_count:
    min_rows: 1
  completeness_threshold: 0.95
  duplicate_tolerance: 0.01

quality_thresholds:
  critical: 95
  warning: 85
  acceptable: 75
