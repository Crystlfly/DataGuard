# Data Quality Rules Configuration
# Project: DataGuard Framework
# Initially, no dataset rules are defined.
# Users create rules in the Quality Rules Studio (or click 'Auto-Generate Baseline Rules').

global_rules:
  row_count:
    min_rows: 1
  completeness_threshold: 0.95
  duplicate_tolerance: 0.01

quality_thresholds:
  critical: 95
  warning: 85
  acceptable: 75
